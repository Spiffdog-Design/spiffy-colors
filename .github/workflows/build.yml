name: Publish to npm

on:
  push:
    branches: [trunk]

permissions:
  contents: read
  id-token: write  # CRITICAL for OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only uncomment if you set an environment name in npm:
    # environment: npm
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      
      # CRITICAL: npm 11.5.1+ required for trusted publishing
      - name: Update npm
        run: npm install -g npm@latest
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      # NO NODE_AUTH_TOKEN, NO --provenance flag needed
      - name: Publish
        run: npm publish --access public
