name: Build and Publish to NPM

on:
  push:
    branches: [trunk]

permissions:
  contents: read
  id-token: write  # CRITICAL for OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      # DON'T use setup-node with registry-url for trusted publishing
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      # CRITICAL: npm 11.5.1+ required for trusted publishing
      - name: Update npm
        run: npm install -g npm@latest
      
      - name: Debug - Check npm version and OIDC
        run: |
          npm --version
          echo "OIDC Token URL available: ${ACTIONS_ID_TOKEN_REQUEST_URL:+YES}"
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Debug - Check package.json
        run: |
          echo "Package name: $(node -p "require('./package.json').name")"
          echo "Package version: $(node -p "require('./package.json').version")"
      
      # NO NODE_AUTH_TOKEN, NO --provenance flag needed
      - name: Publish
        run: npm publish --access public --registry https://registry.npmjs.org/
