name: Publish to npm

on:
  push:
    branches: [trunk]

permissions:
  contents: read
  id-token: write  # CRITICAL for OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      
      # CRITICAL: npm 11.5.1+ required for trusted publishing
      - name: Update npm
        run: npm install -g npm@latest
      
      - name: Debug - Check npm version and OIDC
        run: |
          npm --version
          echo "OIDC Token URL available: ${ACTIONS_ID_TOKEN_REQUEST_URL:+YES}"
          echo "OIDC Token URL: ${ACTIONS_ID_TOKEN_REQUEST_URL:-NOT SET}"
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Debug - Check package.json
        run: |
          echo "Package name: $(node -p "require('./package.json').name")"
          echo "Package version: $(node -p "require('./package.json').version")"
      
      - name: Debug - Dry run publish
        run: npm publish --dry-run --access public
        
      # NO NODE_AUTH_TOKEN, NO --provenance flag needed
      - name: Publish
        run: npm publish --access public
